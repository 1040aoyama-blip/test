<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>株式ポートフォリオ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>株式ポートフォリオ</h1>
    <div class="header-actions">
      <button type="button" id="export-btn" class="btn-secondary">エクスポート</button>
      <label class="btn-secondary file-btn">
        インポート
        <input type="file" id="import-input" accept="application/json,.json" hidden>
      </label>
      <button type="button" id="sample-btn" class="btn-secondary">サンプルデータ</button>
    </div>
  </header>

  <main>
    <section class="summary" id="summary" aria-label="サマリー"></section>

    <div id="errors" class="errors" role="alert" hidden></div>

    <div class="grid">
      <section class="card">
        <h2>保有銘柄</h2>
        <p class="hint">現在値のセルをクリックすると株価を更新できます。</p>
        <div class="table-wrap">
          <table class="holdings">
            <thead>
              <tr>
                <th>銘柄</th>
                <th class="num">株数</th>
                <th class="num">平均取得単価</th>
                <th class="num">現在値</th>
                <th class="num">評価額</th>
                <th class="num">評価損益</th>
                <th class="num">構成比</th>
              </tr>
            </thead>
            <tbody id="holdings-body"></tbody>
          </table>
        </div>
        <p id="holdings-empty" class="empty">まだ保有銘柄がありません。右のフォームから取引を登録してください。</p>
      </section>

      <section class="card">
        <h2>資産配分</h2>
        <div class="chart" id="chart"></div>
      </section>

      <section class="card">
        <h2>取引を登録</h2>
        <form id="tx-form" autocomplete="off">
          <div class="field-row">
            <label>種別
              <select name="type">
                <option value="buy">買い</option>
                <option value="sell">売り</option>
                <option value="dividend">配当</option>
              </select>
            </label>
            <label>日付
              <input type="date" name="date" required>
            </label>
          </div>
          <div class="field-row">
            <label>銘柄コード
              <input type="text" name="symbol" placeholder="例: 7203" list="symbol-list" required>
            </label>
            <label>銘柄名（任意）
              <input type="text" name="name" placeholder="例: トヨタ自動車">
            </label>
          </div>
          <datalist id="symbol-list"></datalist>
          <div class="field-row trade-only">
            <label>株数
              <input type="number" name="shares" min="0" step="any">
            </label>
            <label>単価
              <input type="number" name="price" min="0" step="any">
            </label>
          </div>
          <div class="field-row">
            <label class="dividend-only" hidden>配当金額
              <input type="number" name="amount" min="0" step="any">
            </label>
            <label>手数料・税
              <input type="number" name="fee" min="0" step="any" value="0">
            </label>
          </div>
          <p id="form-error" class="form-error" role="alert"></p>
          <button type="submit" class="btn-primary">登録</button>
        </form>
      </section>

      <section class="card wide">
        <h2>取引履歴</h2>
        <div class="table-wrap">
          <table class="history">
            <thead>
              <tr>
                <th>日付</th>
                <th>種別</th>
                <th>銘柄</th>
                <th class="num">株数</th>
                <th class="num">単価</th>
                <th class="num">金額</th>
                <th class="num">手数料</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="history-body"></tbody>
          </table>
        </div>
        <p id="history-empty" class="empty">取引履歴はありません。</p>
      </section>

      <section class="card wide" id="closed-section" hidden>
        <h2>売却済み銘柄</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>銘柄</th>
                <th class="num">実現損益</th>
                <th class="num">受取配当</th>
              </tr>
            </thead>
            <tbody id="closed-body"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <footer class="app-footer">データはこのブラウザ内（localStorage）にのみ保存されます。</footer>

  <script src="portfolio.js"></script>
  <script src="app.js"></script>
</body>
</html>
