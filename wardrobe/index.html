<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ワードローブ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>ワードローブ</h1>
    <div class="actions">
      <button id="btn-add" class="primary">＋ アイテム追加</button>
      <button id="btn-settings">タグ管理</button>
      <details class="menu">
        <summary>その他</summary>
        <div class="menu-body">
          <button id="btn-export">エクスポート（JSON）</button>
          <label class="as-button">インポート（JSON）<input id="file-import" type="file" accept="application/json,.json" hidden></label>
          <button id="btn-sample">サンプルデータを読み込む</button>
        </div>
      </details>
    </div>
  </header>

  <main>
    <p id="status" class="status" role="status" hidden></p>
    <div class="toolbar">
      <input id="search" type="search" placeholder="名前・タグ・メモで検索">
      <div id="color-filter" class="chips" aria-label="色で絞り込み"></div>
    </div>

    <nav id="tabs" class="tabs" role="tablist"></nav>

    <section id="list" aria-live="polite"></section>
  </main>

  <!-- 追加・編集ダイアログ -->
  <dialog id="item-dialog">
    <form id="item-form" method="dialog">
      <h2 id="item-dialog-title">アイテム追加</h2>

      <label class="field">
        <span>名前 <em>必須</em></span>
        <input id="f-name" required maxlength="80" placeholder="例: ネイビーのウールスラックス">
      </label>

      <div class="field">
        <span>カテゴリー</span>
        <div id="f-category" class="chips"></div>
        <div class="inline-add">
          <input id="f-new-category" placeholder="新しいカテゴリー" maxlength="30">
          <button type="button" id="f-add-category">追加</button>
        </div>
      </div>

      <div class="field">
        <span>季節</span>
        <div id="f-seasons" class="chips"></div>
      </div>

      <div class="field">
        <span>色</span>
        <div id="f-colors" class="chips"></div>
        <div class="inline-add">
          <input id="f-new-color" placeholder="新しい色" maxlength="20">
          <input id="f-new-color-hex" type="color" value="#888888" aria-label="色見本">
          <button type="button" id="f-add-color">追加</button>
        </div>
      </div>

      <div class="field">
        <span>その他のタグ</span>
        <div id="f-tags" class="chips"></div>
        <div class="inline-add">
          <input id="f-new-tag" placeholder="例: お気に入り、仕事用（Enterで追加）" maxlength="30">
          <button type="button" id="f-add-tag">追加</button>
        </div>
      </div>

      <label class="field">
        <span>メモ</span>
        <textarea id="f-memo" rows="2" maxlength="300" placeholder="ブランド、購入時期など"></textarea>
      </label>

      <p id="f-error" class="error" hidden></p>

      <div class="dialog-actions">
        <button type="button" id="f-delete" class="danger" hidden>削除</button>
        <span class="spacer"></span>
        <button type="button" id="f-cancel">キャンセル</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <!-- タグ管理ダイアログ -->
  <dialog id="settings-dialog">
    <div class="settings">
      <h2>タグ管理</h2>
      <h3>カテゴリー（タブの並び順）</h3>
      <ul id="s-categories" class="manage-list"></ul>
      <div class="inline-add">
        <input id="s-new-category" placeholder="新しいカテゴリー" maxlength="30">
        <button type="button" id="s-add-category">追加</button>
      </div>
      <h3>色</h3>
      <ul id="s-colors" class="manage-list"></ul>
      <div class="inline-add">
        <input id="s-new-color" placeholder="新しい色" maxlength="20">
        <input id="s-new-color-hex" type="color" value="#888888" aria-label="色見本">
        <button type="button" id="s-add-color">追加</button>
      </div>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button type="button" id="s-close" class="primary">閉じる</button>
      </div>
    </div>
  </dialog>

  <!-- 確認ダイアログ -->
  <dialog id="confirm-dialog" class="confirm">
    <div class="settings">
      <p id="c-message"></p>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button type="button" id="c-cancel">キャンセル</button>
        <button type="button" id="c-ok" class="primary">OK</button>
      </div>
    </div>
  </dialog>

  <script src="wardrobe.js"></script>
  <script src="app.js"></script>
</body>
</html>
